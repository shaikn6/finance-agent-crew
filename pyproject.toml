[project]
name = "finance-agent-crew"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "langgraph>=1.2.6",
    "langchain-anthropic>=1.4.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.49.0",
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.1",
    "beautifulsoup4>=4.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov>=5.0", "pytest-asyncio>=1.4.0", "ruff>=0.15.18"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
