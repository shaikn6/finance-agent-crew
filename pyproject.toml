[project]
name = "finance-agent-crew"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30",
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "pytest-asyncio>=1.4.0", "ruff>=0.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
