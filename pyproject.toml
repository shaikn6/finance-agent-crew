[project]
name = "finance-agent-crew"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.122.0",
    "fastapi>=0.138.1",
    "uvicorn[standard]>=0.52.3",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "pytest-asyncio>=1.4.0", "ruff>=0.16.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
