[project]
name = "finance-agent-crew"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.9.0",
    "fastapi>=0.163.2",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pytest-cov>=7.1.0", "pytest-asyncio>=1.5.0", "ruff>=0.17.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
