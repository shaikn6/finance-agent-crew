name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: pip install ruff && ruff check src/ --ignore E501 || true
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: |
          pip install             pytest>=8.2             pytest-cov>=5.0             pytest-asyncio>=0.23             anthropic>=0.30             pydantic>=2.7             fastapi>=0.111             uvicorn             httpx>=0.27             beautifulsoup4>=4.12             lxml
      - name: Run tests with coverage
        run: |
          pytest tests/ -v             --cov=src             --cov-report=xml             --cov-report=term-missing             --cov-fail-under=95
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: pip install bandit && bandit -r src/ -ll || true
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t finance-agent-crew:ci . || echo "No Dockerfile"
        continue-on-error: true
